[package]
name = "review-ui"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
review-core.workspace = true
serde.workspace = true
serde_json.workspace = true
leptos = { version = "0.8", features = ["csr"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
gloo-timers = { version = "0.3", features = ["futures"] }
console_error_panic_hook = "0.1"
web-sys = { version = "0.3", features = ["Window","Document","Element","HtmlElement","FocusOptions","HtmlInputElement","HtmlTextAreaElement","Node","NodeList","Selection","Range","DomRect","DomRectList","TreeWalker","WebSocket","MessageEvent","CloseEvent","Location","Storage","Navigator","Clipboard","Event","MouseEvent","KeyboardEvent"] }
