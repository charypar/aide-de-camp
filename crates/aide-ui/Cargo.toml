[package]
name = "aide-ui"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
aide-core.workspace = true
serde_json.workspace = true
leptos = { version = "0.8", features = ["csr"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
gloo-timers = "0.3"
console_error_panic_hook = "0.1"
web-sys = { version = "0.3", features = ["Window", "Document", "Location", "WebSocket", "MessageEvent", "CloseEvent", "Event", "HtmlInputElement", "HtmlSelectElement", "Navigator", "Clipboard", "Storage"] }
