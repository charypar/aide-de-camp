[package]
name = "review-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "aide-review"
path = "src/main.rs"

[dependencies]
review-core.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
rusqlite = { version = "0.37", features = ["bundled"] }
clap = { version = "4", features = ["derive"] }
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
rust-embed = { version = "8", features = ["debug-embed", "interpolate-folder-path"] }
mime_guess = "2"
webbrowser = "1"
fs2 = "0.4"
arborium = { version = "2.18.2", default-features = false, features = [
    "lang-bash", "lang-c", "lang-c-sharp", "lang-cpp", "lang-css",
    "lang-dart", "lang-dockerfile", "lang-elixir", "lang-go", "lang-graphql",
    "lang-hcl", "lang-html", "lang-ini", "lang-java", "lang-javascript",
    "lang-json", "lang-kotlin", "lang-lua", "lang-make",
    "lang-nix", "lang-php", "lang-python", "lang-ruby", "lang-rust",
    "lang-scala", "lang-scss", "lang-sql", "lang-svelte", "lang-swift",
    "lang-toml", "lang-tsx", "lang-typescript", "lang-vue", "lang-xml",
    "lang-yaml", "lang-zig",
] }
# Supply both Markdown block and inline grammars to Arborium (bold, links, inline code).
tree-sitter-md = "0.5.4"

[dev-dependencies]
tempfile = "3"
