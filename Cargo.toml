[workspace]
members = ["crates/review-core", "crates/review-server", "crates/review-ui", "crates/xtask", "crates/aide-core", "crates/aide-server", "crates/aide-ui"]
default-members = ["crates/review-core", "crates/review-server", "crates/aide-core", "crates/aide-server"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
review-core = { path = "crates/review-core" }
aide-core = { path = "crates/aide-core" }

[profile.release]
lto = "thin"
